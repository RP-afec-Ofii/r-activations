<!DOCTYPE html>
<html lang="fr">
<head>
<meta name="copyright" content="© 2026 Groupe afec – Tous droits réservés">
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Réactivation des connaissances – Groupe afec</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#2A4A9B; --blue-d:#1C3572; --blue-s:#DCE6F7;
  --green:#4E9E31; --green-d:#3A7A23; --green-s:#E5F2DC;
  --ink:#1B2540; --muted:#59627A; --line:#CFD8E8;
  --paper:#F3F6FB; --card:#FFFFFF; --amber:#C98A00; --red:#B8372F;
  --r:14px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.55 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
a{color:var(--blue)}
h1,h2,h3{line-height:1.2;margin:0}
h1{font-size:clamp(1.6rem,4vw,2.3rem)}
h2{font-size:1.25rem}
h3{font-size:1.05rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.top{background:#fff;color:var(--blue-d);border-bottom:4px solid var(--blue)}
.top .in{max-width:1100px;margin:auto;padding:14px 20px;display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;text-decoration:none}
.logo img{display:block;height:40px;width:auto}
.top small{margin-left:auto;font-size:.9rem;font-weight:700;color:var(--blue-d)}
main{max-width:1100px;margin:auto;padding:24px 20px 120px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--card);padding:9px 15px;border-radius:10px;cursor:pointer;text-decoration:none;color:var(--ink);font-weight:700;font-size:.95rem;white-space:nowrap}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-d)}
.btn.go{background:var(--green);border-color:var(--green);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:.88rem}
.btn.ok{border-color:var(--green);color:var(--green-d)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spacer{flex:1}
.muted{color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:20px}
.hero{padding:28px 0 30px;max-width:720px}
.hero h1{font-size:clamp(2rem,6vw,3.4rem);color:var(--blue-d)}
.hero p{font-size:1.15rem;color:var(--muted);margin:.6em 0 0}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.choice{display:block;text-decoration:none;color:var(--ink);background:var(--card);border-radius:var(--r);padding:26px;border:2px dashed var(--blue);position:relative}
.choice.g{border-color:var(--green)}
.choice:hover{background:var(--blue-s)}
.choice.g:hover{background:var(--green-s)}
.choice .ico{font-size:2rem}
.choice h2{margin:.4em 0 .3em;color:var(--blue-d)}
.choice.g h2{color:var(--green-d)}
.choice p{margin:0;color:var(--muted)}
.cut{position:absolute;top:-13px;left:22px;background:var(--paper);padding:0 6px}
.days{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}
.day{border:2px solid var(--line);background:var(--card);border-radius:var(--r);padding:12px 14px;text-align:left;cursor:pointer}
.day b{display:block;font-size:1.4rem;color:var(--blue-d)}
.day span{font-size:.88rem;color:var(--muted)}
.day.on{border-color:var(--blue);background:var(--blue-s)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:18px}
.panel-h{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px}
.step{width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
textarea,select{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
textarea:focus,select:focus{border-color:var(--blue);outline:none}
select{width:auto}
.empty{color:var(--muted);font-style:italic;margin:0}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.gcard{border:2px dashed var(--blue);border-radius:var(--r);padding:16px;background:#fff}
.gcard:nth-child(even){border-color:var(--green)}
.gnum{font-weight:700;font-size:1.15rem}
.themes{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.theme{font-size:.85rem;font-style:italic;padding:3px 10px;border-radius:999px;background:var(--blue-s);color:var(--blue-d)}
.t0{--gc:var(--blue);--gs:var(--blue-s);--gd:var(--blue-d)}
.t1{--gc:var(--green);--gs:var(--green-s);--gd:var(--green-d)}
.t2{--gc:#C8551B;--gs:#FBE5D6;--gd:#93390C}
.t3{--gc:#7A3E9D;--gs:#EFE3F6;--gd:#56276F}
.theme.t0,.theme.t1,.theme.t2,.theme.t3{background:var(--gs);color:var(--gd)}
.members{list-style:none;padding:0;margin:10px 0 12px;display:grid;gap:6px}
.members li{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.rchip{font-size:.8rem;padding:2px 8px;border-radius:6px;background:var(--paper);border:1px solid var(--line);white-space:nowrap}
.gcard footer{display:flex;gap:8px;flex-wrap:wrap}
.timer{display:grid;gap:10px}
.tdisp{font-size:clamp(2.6rem,9vw,4.2rem);font-weight:700;font-variant-numeric:tabular-nums;color:var(--blue-d);line-height:1}
.tdisp.low{color:var(--amber)}
.tdisp.done{color:var(--red)}
.tbar{height:8px;background:var(--blue-s);border-radius:99px;overflow:hidden}
.tbar div{height:100%;background:var(--green);transition:width .25s linear}
.timer-full:fullscreen{background:#fff;display:grid;place-content:center;padding:40px}
.timer-full:fullscreen .tdisp{font-size:22vw;text-align:center}
.ghead{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:start;margin-bottom:18px}
.ghead .timer{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:270px}
.ghead .tdisp{font-size:2.6rem}
.kicker{color:var(--green-d);font-weight:700;margin:0 0 4px}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.role{border-left:4px solid var(--blue);padding:6px 12px;background:var(--paper);border-radius:0 8px 8px 0}
.role:nth-child(even){border-color:var(--green)}
.role b{display:block}
.role span{font-size:.88rem;color:var(--muted)}
.progress{position:sticky;top:0;z-index:5;background:var(--paper);padding:10px 0;display:flex;align-items:center;gap:12px}
.pbar{flex:1;height:10px;background:var(--blue-s);border-radius:99px;overflow:hidden}
.pbar div{height:100%;background:var(--green);width:0;transition:width .3s}
.saved{font-size:.85rem;color:var(--green-d);min-width:90px}
.tblock{margin:26px 0 8px}
.tblock h2{color:var(--blue-d);padding-bottom:6px;border-bottom:3px solid var(--blue)}
.tblock.t0 h2,.tblock.t1 h2,.tblock.t2 h2,.tblock.t3 h2{color:var(--gd);border-color:var(--gc)}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-top:14px}
.qhead{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.qn{flex:none;width:32px;height:32px;border-radius:50%;background:var(--blue-s);color:var(--blue-d);font-weight:700;display:grid;place-items:center}
.qcard.complete .qn{background:var(--green);color:#fff}
.fields{display:grid;gap:10px}
.flabel{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.92rem;margin-bottom:4px}
.dot{width:12px;height:12px;border-radius:3px;border:2px solid var(--line);flex:none}
.dot.on{background:var(--green);border-color:var(--green)}
.actions{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:center;flex-wrap:wrap;z-index:10}
.aq{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-top:12px}
.aq h3{margin-bottom:10px;font-size:1.15rem}
.aline{margin:6px 0;display:grid;grid-template-columns:170px 1fr;gap:10px}
.aline b{color:var(--muted);font-size:.92rem}
.aline .v{white-space:pre-wrap}
.aline .v.none{color:#9aa2b5;font-style:italic}
.piste{margin-top:12px;padding:10px 14px;background:#FFF8E6;border-left:4px solid var(--amber);border-radius:0 8px 8px 0;font-size:.95rem}
.hide-pistes .piste{display:none}
.big .aq{font-size:1.2rem}
.big .aq h3{font-size:1.4rem}
.notice{background:var(--blue-s);border-radius:10px;padding:12px 16px;margin:12px 0}
.switch{display:inline-flex;align-items:center;gap:8px;font-weight:700;cursor:pointer}
.switch input{width:20px;height:20px;accent-color:var(--amber)}
.qrwall{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.qrcard{background:#fff;border:2px dashed var(--blue);border-radius:var(--r);padding:16px;text-align:center}
.qrcard:nth-child(even){border-color:var(--green)}
.qrbox{display:grid;place-items:center;margin:12px auto;min-height:200px}
.qrbox img,.qrbox canvas{max-width:100%;height:auto}
.qrcard .names{font-size:.92rem;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(20,30,60,.55);display:grid;place-items:center;z-index:50;padding:20px}
.modal .box{background:#fff;border-radius:var(--r);padding:22px;max-width:420px;width:100%;text-align:center}
.link{word-break:break-all;font-size:.8rem;background:var(--paper);padding:8px;border-radius:8px;text-align:left}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;z-index:60}
@media (max-width:720px){
  body{font-size:16px}
  .ghead{grid-template-columns:1fr}
  .ghead .timer{min-width:0}
  .days{grid-template-columns:1fr}
  .aline{grid-template-columns:1fr;gap:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  .top,.actions,.progress,.no-print,.toolbar .btn{display:none!important}
  body{background:#fff}
  .qcard,.aq,.panel{break-inside:avoid;border-color:#999}
  main{padding:0}
}
.lock{max-width:440px;margin:32px auto}
.lock input{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:#fff;margin:4px 0 6px}
.lock .err{color:var(--red);min-height:1.4em;margin:0 0 10px;font-weight:700}
.gstat{font-weight:400;color:var(--muted)}
.gstat.ok{color:var(--green-d)}
.sync{font-size:.92rem;color:var(--muted)}
.sync.ok{color:var(--green-d);font-weight:700}
.sync.err{color:var(--red);font-weight:700}
.hoststat{margin:0 0 12px;font-size:.95rem;color:var(--muted)}
.hoststat.ok{color:var(--green-d)}
.hoststat.err,.hoststat.nolib{color:var(--red);font-weight:700}
.scode{font-size:1.25em;letter-spacing:.12em;color:var(--ink);background:var(--green-s);padding:1px 8px;border-radius:6px}
#code{text-transform:uppercase;letter-spacing:.15em;font-weight:700}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:12px}
.cbox{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.cbox b{display:block;color:var(--blue-d)}
.cbox span{font-size:.92rem}
.cgroups{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:14px}
.cgroup{border-radius:10px;padding:10px 14px;background:var(--blue);color:#fff}
.cgroup.t0,.cgroup.t1,.cgroup.t2,.cgroup.t3{background:var(--gc)}
.cgroup b{display:block;font-size:1.05rem}
.cgroup span{font-style:italic}
.big .consigne{font-size:1.2rem}
.access{background:var(--green-s);border-left:5px solid var(--green);border-radius:0 10px 10px 0;padding:12px 16px;margin-bottom:16px;font-size:1.15rem}
.gpick{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.gbtn{display:grid;place-items:center;min-height:110px;border-radius:var(--r);background:var(--blue);color:#fff;font-size:1.6rem;font-weight:700;text-decoration:none}
.gbtn.t0,.gbtn.t1,.gbtn.t2,.gbtn.t3{background:var(--gc)}
.gpage h1{color:var(--gd)}
.gpage .qcard{border-left:6px solid var(--gc)}
.gpage .qn{background:var(--gs);color:var(--gd)}
.gpage .qcard.complete .qn{background:var(--gc);color:#fff}
.gpage #pfill{background:var(--gc)}
.gpage .btn.primary{background:var(--gc);border-color:var(--gc)}
.gpage .ghead{border-top:6px solid var(--gc);padding-top:12px}
.cmini{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--gc);border-radius:10px;padding:9px 14px;font-size:.92rem;margin-bottom:14px}
.cmini b{color:var(--gd)}
.gbtn.off{background:var(--line);color:var(--muted);cursor:default}
.spick{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.spick .btn{justify-content:center;padding:14px}
.panel h2 .step{display:inline-grid;vertical-align:middle;margin-right:6px}
.rcard{text-decoration:none;color:inherit;display:block}
.rcard.got{border-style:solid;border-color:var(--green)}
.legal{max-width:1100px;margin:30px auto 0;padding:14px 16px 24px;border-top:1px solid var(--line);font-size:.8rem;color:var(--muted);text-align:center}
@media print{.legal{margin-top:10px}}
</style>
</head>

 J2:{label:"J2", rappel:"Rappel de la Journée 1", themes:[
  {name:"Vie administrative & financière", qs:[
   [`À quoi sert d'avoir une domiciliation ?`,
    `Avoir une adresse officielle pour recevoir son courrier et faire valoir ses droits (CAF, préfecture, banque, impôts…) quand on n'a pas de logement stable. Elle se demande au CCAS/CIAS ou auprès d'une association agréée. <i>Ex. : une personne hébergée chez des amis se domicilie au CCAS pour recevoir les courriers de la préfecture.</i>`],
   [`Que faire en cas de multiples refus d'ouverture de compte bancaire ?`,
    `Utiliser le <b>droit au compte</b> : demander une attestation de refus à la banque, puis saisir la <b>Banque de France</b>, qui désigne une banque obligée d'ouvrir un compte avec les services bancaires de base gratuits.`],
   [`Quel site pour échanger son permis ? Pourrait-il y avoir des aides pour passer son permis ? Pour quels cas ?`,
    `Échange d'un permis étranger : en ligne sur le site de l'<b>ANTS</b>, dans l'année qui suit l'installation en France (pays ayant un accord d'échange). Aides : <b>CPF</b>, <b>France Travail</b> pour les demandeurs d'emploi, <b>permis à 1 €/jour</b> (15-25 ans), aide aux apprentis, aides de la région, de la commune ou de la mission locale.`],
   [`Quelles conditions pour une demande de naturalisation ?`,
    `Être majeur, résider en France de façon stable depuis au moins <b>5 ans</b> (réduit dans certains cas, ex. 2 ans d'études supérieures réussies en France), ressources stables, français niveau <b>B2</b> (depuis 2026), connaissance de l'histoire et des valeurs de la République (examen civique), adhésion aux principes républicains, bonne conduite. Demande en ligne (ANEF).`]
  ]},
  {name:"Logement & santé", qs:[
   [`Quelles sont les obligations du bailleur vis-à-vis du locataire ?`,
    `Remettre un <b>logement décent</b> (sans danger pour la santé et la sécurité), faire les <b>grosses réparations</b> et entretenir le logement, garantir la <b>jouissance paisible</b> (pas d'entrée sans accord), remettre gratuitement les <b>quittances</b>, rendre le <b>dépôt de garantie</b> (1 mois si l'état des lieux est conforme, 2 mois sinon). <i>Ex. : chaudière en panne par usure = réparation à la charge du bailleur.</i>`],
   [`La demande de logement social est renouvelée automatiquement. Vrai ou Faux ?`,
    `<b>Faux.</b> À renouveler <b>chaque année</b> avant la date anniversaire (demande-logement-social.gouv.fr ou guichet), sinon elle est supprimée et on perd son ancienneté.`],
   [`Quelle démarche pour les demandes de logements social urgentes ?`,
    `Le recours <b>DALO</b> devant la commission de médiation du département (délai anormalement long, logement indigne ou suroccupé, menace d'expulsion…). En urgence : le <b>115</b> (hébergement d'urgence) et le SIAO.`],
   [`Comment fonctionne la couverture maladie ? (Remboursement, prise en charge…)`,
    `L'<b>Assurance maladie</b> rembourse une partie des soins (ex. 70 % d'une consultation chez le médecin traitant). La <b>complémentaire santé</b> (mutuelle, ou C2S selon les ressources) rembourse le reste. Carte Vitale, médecin traitant, parcours de soins. Sans titre de séjour : AME.`],
   [`Quels sont les droits d'un patient ?`,
    `Être informé, donner son <b>consentement</b> ou refuser un soin, <b>secret médical</b>, accès à son dossier, libre choix du médecin, dignité, non-discrimination, soulagement de la douleur (loi du 4 mars 2002).`]
  ]},
  {name:"Travail", qs:[
   [`Où puis-je consulter mes droits et devoirs au travail ?`,
    `Code du travail (Légifrance, code.travail.gouv.fr), <b>convention collective</b>, contrat, règlement intérieur, service-public.fr. Aide : inspection du travail, CSE, syndicats.`],
   [`En cas de discrimination, harcèlement etc., au travail, je peux…`,
    `Garder des preuves, en parler au CSE ou au médecin du travail, alerter l'employeur, contacter l'<b>inspection du travail</b>, saisir le <b>Défenseur des droits</b> (3928), les prud'hommes, porter plainte (le harcèlement est un délit).`],
   [`Qu'est-ce que la VAE ? Pourrait-il y avoir des aides au financement de cette démarche ?`,
    `La <b>Validation des acquis de l'expérience</b> : obtenir tout ou partie d'un diplôme grâce à son expérience (pro, bénévole…). Portail France VAE. Financement : CPF, France Travail, employeur/OPCO, région.`],
   [`Comment s'applique la laïcité au travail ?`,
    `<b>Dans le service public</b>, les agents doivent être <b>neutres</b> : pas de signe religieux visible, égalité de traitement des usagers. <b>Dans une entreprise privée</b>, le salarié est libre d'exprimer sa religion ; l'employeur peut la restreindre seulement si c'est justifié (sécurité, hygiène, contact clientèle) et proportionné, ou par une clause de neutralité dans le règlement intérieur. Aucune <b>discrimination</b> à l'embauche ou dans la carrière en raison de la religion.`],
   [`Suis-je autorisé à exercer une activité non salariale alors que je possède un titre de séjour salarié d'une durée de validité de 1 an ?`,
    `<b>En principe non</b> : la carte « salarié » autorise une activité salariée. Pour créer une entreprise, demander un <b>changement de statut</b> (carte « entrepreneur / profession libérale ») en préfecture.`]
  ]},
  {name:"Famille & Valeurs républicaines", qs:[
   [`Qu'est-ce que l'autorité parentale ? À quoi engage-t-elle son détenteur ?`,
    `Droits et devoirs des parents dans l'intérêt de l'enfant jusqu'à ses 18 ans : protéger sa sécurité, sa santé, sa moralité, assurer son éducation. Exercée en commun, même après séparation. Violences éducatives interdites (loi de 2019).`],
   [`Qu'est-ce que le dispositif OEPRE ?`,
    `<b>Ouvrir l'École aux Parents pour la Réussite des Enfants</b> : formation gratuite dans les écoles et collèges pour les parents étrangers : français, fonctionnement de l'école, valeurs de la République.`],
   [`Comment s'applique la laïcité à l'école publique ?`,
    `L'école publique est <b>gratuite, laïque et obligatoire</b> (lois Ferry 1881-1882). Les enseignants sont <b>neutres</b> ; la loi du <b>15 mars 2004</b> interdit aux élèves les signes religieux ostensibles (et, depuis 2023, les tenues comme l'abaya). Les programmes s'appliquent à tous ; l'école protège la liberté de conscience des élèves. <i>Ex. : une Charte de la laïcité est affichée dans chaque école.</i>`],
   [`Quels sont les principes, les valeurs et les symboles de la République française ? Que signifient-ils ?`,
    `<b>Principes</b> (article 1 de la Constitution) : République <b>indivisible</b> (une loi pour tous), <b>laïque</b> (neutralité religieuse de l'État), <b>démocratique</b> (le pouvoir vient du peuple), <b>sociale</b> (solidarité). <b>Valeurs</b> : Liberté, Égalité, Fraternité (+ laïcité). <b>Symboles</b> : drapeau bleu-blanc-rouge, <i>La Marseillaise</i>, Marianne, la devise, le 14 juillet, le sceau ; le coq est un symbole non officiel.`],
   [`Qu'est-ce que la Laïcité ? Quels sont les piliers de cette loi ?`,
    `Loi du <b>9 décembre 1905</b>. Piliers : <b>liberté de conscience</b> et libre exercice des cultes, <b>séparation</b> des Églises et de l'État, <b>neutralité</b> de l'État et égalité de tous quelle que soit la religion.`],
   [`La langue française est la langue officielle en France, depuis quelle année ?`,
    `Ordonnance de <b>Villers-Cotterêts (1539)</b> pour les actes officiels ; inscrite dans la Constitution en <b>1992</b> (article 2).`]
  ]}
 ]},
 J3:{label:"J3", rappel:"Rappel de la Journée 2", themes:[
  {name:"Histoire de France", qs:[
   [`Quels régimes politiques la France a-t-elle connus ?`,
    `Monarchie (absolue, puis constitutionnelle en 1791), cinq Républiques (1792, 1848, 1870, 1946, 1958), deux Empires (Napoléon Ier, Napoléon III), Restauration et monarchie de Juillet (1814-1848), régime de Vichy (1940-1944).`],
   [`Quels événements et personnages phares de l'Histoire de la France avez-vous retenus lors de la journée précédente ?`,
    `Réponses libres. Pistes : Révolution de 1789, Napoléon, Victor Schœlcher, Jules Ferry, Jean Jaurès, de Gaulle et la Résistance, Simone Veil, Robert Badinter…`],
   [`Citez cinq dates importantes de l'Histoire de la France.`,
    `<b>1789</b> Révolution, DDHC · <b>1848</b> abolition de l'esclavage, suffrage universel masculin · <b>1905</b> laïcité · <b>1944</b> vote des femmes · <b>1958</b> Ve République.`],
   [`Durant la troisième et la cinquième République, la France a connu de grandes avancées : quelles étaient ces lois ?`,
    `IIIe : lois <b>Ferry</b> 1881-1882 (école gratuite, obligatoire, laïque), presse 1881, syndicats 1884, associations <b>1901</b>, laïcité <b>1905</b>. Ve : majorité à 18 ans 1974, loi <b>Veil</b> 1975, abolition de la peine de mort <b>1981</b>, PACS 1999, mariage pour tous 2013, IVG dans la Constitution 2024.`],
   [`Combien de jours fériés en France ?`,
    `<b>11</b> : 1er janvier, lundi de Pâques, 1er mai, 8 mai, Ascension, lundi de Pentecôte, 14 juillet, 15 août, 1er novembre, 11 novembre, 25 décembre. + 2 en Alsace-Moselle, et l'abolition de l'esclavage dans les outre-mer.`]
  ]},
  {name:"État de droit & Institutions", qs:[
   [`Quelle définition pour : État de droit ?`,
    `Un État où <b>tout le monde, dirigeants compris, respecte le droit</b> : hiérarchie des normes (Constitution au sommet), séparation des pouvoirs, juges indépendants, droits fondamentaux garantis.`],
   [`Quels sont les trois pouvoirs de la République française ? De quoi se compose chaque pouvoir ? Quelles sont leurs rôles ?`,
    `<b>Législatif</b> : Parlement = Assemblée nationale (577 députés) + Sénat (348 sénateurs) ; vote les lois, contrôle le gouvernement. <b>Exécutif</b> : Président (élu 5 ans) + Gouvernement ; applique les lois. <b>Judiciaire</b> : juges et tribunaux ; règlent les conflits, sanctionnent.`],
   [`Comment les lois sont-elles votées et adoptées ?`,
    `Projet (Gouvernement) ou proposition de loi (parlementaires) → commission → vote à l'Assemblée et au Sénat (« navette ») → si désaccord, commission mixte paritaire → contrôle possible du Conseil constitutionnel → <b>promulgation</b> par le Président → <b>Journal officiel</b>.`],
   [`Quelles sont les missions de la Préfecture ?`,

  ]},
  {name:"Organisation territoriale", qs:[
   [`Quels sont les acteurs politiques au niveau local et leurs rôles ?`,

   [`Le découpage administratif en France comprend : …………, ………… et …………`,
    `<b>Communes, départements, régions.</b>`],
   [`Que signifie la décentralisation ?`,
    `L'État <b>transfère des compétences et des moyens</b> aux collectivités, qui s'administrent librement par des conseils élus (lois Defferre 1982). <i>Ex. : collèges = département, lycées = région.</i>`]
  ]},
  {name:"Union européenne", qs:[

function cyrb53(str,seed=7){ let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed; for(let i=0,ch;i<str.length;i++){ ch=str.charCodeAt(i); h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677); } h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909); h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909); return (4294967296*(2097151&h2)+(h1>>>0)).toString(36); }
const normCode = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\s+/g,"");

    </div></div>`;
}
function bindTimer(root,T,save){
  clearInterval(window._tick);
  const disp=$("[data-tdisp]",root), bar=$("[data-tbar]",root), go=$("[data-tgo]",root);
  const rem = () => T.endAt ? Math.max(0,(T.endAt-Date.now())/1000) : T.left;
  function paint(){
    const r=rem(), m=Math.floor(r/60), s=Math.floor(r%60);
    disp.textContent = `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
    bar.style.width = (100*r/T.dur)+"%";
    disp.classList.toggle("low", r>0 && r<=300);
    disp.classList.toggle("done", r<=0);
    go.textContent = T.endAt ? "Pause" : (r<=0 ? "Temps écoulé" : (r<T.dur ? "Reprendre" : "Démarrer"));
    if(T.endAt && r<=0){ T.endAt=null; T.left=0; save(); beep(); }
  }
  $$("[data-tset]",root).forEach(b=>b.onclick=()=>{ T.dur=T.left=+b.dataset.tset*60; T.endAt=null; save(); paint(); });
  go.onclick=()=>{ if(T.endAt){ T.left=rem(); T.endAt=null; } else if(T.left>0){ T.endAt=Date.now()+T.left*1000; } save(); paint(); };
  $("[data-treset]",root).onclick=()=>{ T.left=T.dur; T.endAt=null; save(); paint(); };
  const f=$("[data-tfull]",root); if(f) f.onclick=()=>{ const el=$(".timer-full",root); document.fullscreenElement?document.exitFullscreen():el.requestFullscreen?.(); };
  paint(); window._tick=setInterval(paint,250);
}

/* ===== Relais des réponses (Google Apps Script, mémoire temporaire) =====
   Les réponses transitent par un petit relais Google, sur une connexion web classique (https)
   que les réseaux ne bloquent pas. Elles sont gardées en mémoire temporaire (cache),
   jamais dans un fichier, et s'effacent automatiquement au bout de 6 heures au plus. */
/* Collez entre les guillemets l'URL de l'application Web Google Apps Script (elle se termine par /exec). */
const API_URL = "https://script.google.com/macros/s/AKfycbxoHuOGkVOXXsAK34ZkJ5kQe6ftczXp88piGb9_8aZZ2wVyAWmeboeJw1N1CEG7YZ_xnA/exec";
let S = Object.assign({day:"J2", salle:null, timer:{dur:1500,left:1500,endAt:null}}, store.get("afec:formateur", {}));
if(!DATA[S.day]) S.day="J2";
if(!salleName(S.salle)) S.salle=null;
const saveS = () => store.set("afec:formateur", S);
const R = {};                       // réponses reçues : { numéroGroupe: {answers, v, date} }
const clearR = () => { for(const k in R) delete R[k]; };
const TOKEN = sess.get("afec:token", null) || (()=>{ const t=Math.random().toString(36).slice(2,12); sess.set("afec:token", t); return t; })();
let hostState="off", hostTimer=null, hostKey=null;

async function apiGet(params){
  const r = await fetch(API_URL+"?"+new URLSearchParams(params), {cache:"no-store"});
  const j = await r.json(); if(!j.ok) throw new Error(j.error||"erreur"); return j;
}
async function apiPost(body){
  const r = await fetch(API_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(body)});
  const j = await r.json(); if(!j.ok) throw new Error(j.error||"erreur"); return j;
}

function paintHost(){
  const txt = {
    off:"", wait:"⏳ Connexion en cours…",
    ok:`✓ Prêt à recevoir les réponses de la <b>${esc(salleName(S.salle))}</b>`,
    pick:"👉 Choisissez votre salle pour recevoir les réponses des groupes.",
    busy:`⚠️ La ${esc(salleName(S.salle))} est déjà ouverte par un autre formateur. Choisissez une autre salle.`,
    err:"⚠️ Connexion impossible pour le moment, nouvel essai automatique…",
    noapi:"⚠️ Relais non configuré : collez l'URL Google Apps Script dans la constante API_URL en haut du script de index.html."
  }[hostState];
  $$("[data-host]").forEach(el=>{ el.innerHTML=txt; el.className="hoststat "+hostState; });
}
function stopHost(){ clearInterval(hostTimer); hostTimer=null; hostKey=null; hostState="off"; paintHost(); }
function startHost(){
  if(!S.salle){ stopHost(); hostState="pick"; paintHost(); return; }
  if(!API_URL){ hostState="noapi"; paintHost(); return; }
  const key = S.salle+"|"+S.day;
  if(hostTimer && hostKey===key){ paintHost(); return; }
  stopHost(); hostKey=key; hostState="wait"; paintHost();
  pollHost(); hostTimer=setInterval(pollHost,3000);
}
async function pollHost(){
  const key=hostKey;
  try{
    const j = await apiGet({action:"poll", room:S.salle, day:S.day, token:TOKEN});
    if(key!==hostKey) return;
    if(j.busy){ hostState="busy"; }
    else { hostState="ok"; clearR(); Object.assign(R, j.groups||{}); }
  }catch(e){ if(key!==hostKey) return; hostState="err"; }
  paintHost();
}
const broadcastDay = () => startHost();

/* Côté tablette : savoir si le formateur est là et quelle journée il a choisie */
function watchRoom(salle, {onDay, onStatus}){
  const me = {closed:false, live:false};
  async function tick(){
    if(me.closed) return;
    if(!API_URL){ onStatus("noapi"); return; }
    try{
      const j = await apiGet({action:"room", room:salle});
      if(me.closed) return;
      me.live = !!j.day;
      if(j.day){ onStatus("live"); onDay(j.day); } else onStatus("absent");
    }catch(e){ if(!me.closed){ me.live=false; onStatus("neterr"); } }
  }
  tick(); me.t=setInterval(tick,5000);
  me.close = () => { me.closed=true; clearInterval(me.t); };
  return me;
}

  if(window._link){ window._link.close(); window._link=null; }

  const r = role();

  else if(h==="/stagiaire") renderChoose();
  else if(h.startsWith("/groupe/")) renderGroup(+h.split("/")[2]);

  window.scrollTo(0,0);
}

  <section class="panel">
    <div class="panel-h"><span class="step" style="background:var(--amber)">?</span><h2>Pistes de réponse ${S.day}</h2><span class="spacer"></span><a class="btn sm" href="#/pistes">Consulter les pistes</a></div>
    <p class="muted" style="margin:0">Pour préparer la séance et compléter la restitution. Non affichées côté stagiaires.</p>
  </section>`;
  paintHost();
  $("#logout").onclick = () => { stopHost(); sess.del("afec:role"); location.hash="#/"; };
  $$("[data-day]").forEach(b=>b.onclick=()=>{ if(b.dataset.day===S.day) return; S.day=b.dataset.day; saveS(); clearR(); broadcastDay(); renderTrainer(); });
  $$("[data-salle]").forEach(b=>b.onclick=()=>{ if(S.salle===b.dataset.salle) return; S.salle=b.dataset.salle; saveS(); clearR(); stopHost(); startHost(); renderTrainer(); });
  $("#clr").onclick = async () => { if(!confirm("Effacer toutes les réponses reçues pour cette salle et cette journée ?")) return; clearR(); refresh(); if(API_URL && S.salle){ try{ await apiPost({action:"clear", room:S.salle, day:S.day, token:TOKEN}); toast("Réponses effacées"); }catch(e){ toast("Effacement impossible pour le moment"); } } };
  bindTimer($("#tpanel"), S.timer, saveS);
  const refresh = () => $$("[data-st]").forEach(el=>{
    const g=+el.dataset.st, r=R[g], card=el.closest(".rcard");
    if(!r){ el.textContent="pas encore de réponse"; el.classList.remove("ok"); card.classList.remove("got"); return; }
    const {n,tot}=countFilled(r.answers,g-1,D);
    el.textContent=`${n}/${tot} réponses · reçu à ${hhmm(r.date)}`; el.classList.add("ok"); card.classList.add("got");
  });
  refresh(); window._poll=setInterval(refresh,1000);
}

function renderConsigne(){
  const D=DATA[S.day];
  app.innerHTML = `
  <div class="toolbar"><a href="#/formateur" class="btn ghost">← Retour</a><h1>Réactivation des connaissances ${D.label}</h1><span class="spacer"></span><p class="hoststat" data-host></p></div>
  <p class="kicker" style="font-size:1.1rem">${esc(D.rappel)}</p>
  <div class="access">Sur la tablette : ouvrez le site, code <b>STAGIAIRE</b>${S.salle?`, <b>${esc(salleName(S.salle))}</b>`:""}, puis choisissez votre groupe.</div>
  <div class="big">${consigneHTML(D,true)}</div>`;
  paintHost();
}

/* ===== Restitution (formateur) ===== */
function answersView(D, t, answers, withPistes){
  return `<section class="tblock t${t%4}"><h2>${esc(D.themes[t].name)}</h2>
    ${D.themes[t].qs.map(([q,p],qi)=>{ const a=answers[`${t}-${qi}`]||{}; return `
      <div class="aq"><h3>${qi+1}. ${esc(q)}</h3>
        ${FIELDS.map(f=>`<div class="aline"><b>${f.icon} ${f.label}</b><div class="v ${a[f.k]?.trim()?"":"none"}">${a[f.k]?.trim()?esc(a[f.k]):"—"}</div></div>`).join("")}
        ${withPistes?`<div class="piste"><b>Piste formateur :</b> ${p}</div>`:""}
      </div>`; }).join("")}
    </section>`;
}
function renderRestitution(g){
  const D=DATA[S.day], n=D.themes.length;
  if(!(g>=1 && g<=n)){ location.hash="#/formateur"; return; }
  app.innerHTML = `
  <div class="toolbar">
    <a href="#/formateur" class="btn ghost">← Retour</a>
    <h1>Restitution du groupe ${g}</h1><span class="spacer"></span>
    <label class="switch"><input type="checkbox" id="pist"> Afficher les pistes</label>
    ${g>1?`<a class="btn sm" href="#/restitution/${g-1}">‹ Groupe ${g-1}</a>`:""}
    ${g<n?`<a class="btn sm" href="#/restitution/${g+1}">Groupe ${g+1} ›</a>`:""}
  </div>
  <p style="margin-top:0"><span class="sync" id="rs"></span></p>
  <div id="av" class="av big hide-pistes">${answersView(D, g-1, {}, true)}</div>`;
  $("#pist").onchange = e => $("#av").classList.toggle("hide-pistes", !e.target.checked);
  let lastV=null;
  const load = () => {
    const r=R[g];
    if(!r){ $("#rs").textContent="Ce groupe n'a encore rien envoyé."; $("#rs").className="sync"; return; }
    $("#rs").textContent=`Réponses reçues à ${hhmm(r.date)}`; $("#rs").className="sync ok";
    if(r.v!==lastV){ lastV=r.v; $("#av").innerHTML=answersView(D, g-1, r.answers, true); }
  };
  load(); window._poll=setInterval(load,1000);
}

function renderPistes(){
  const D=DATA[S.day];
  app.innerHTML = `
  <div class="toolbar"><a href="#/formateur" class="btn ghost">← Retour</a><h1>Pistes de réponse ${D.label}</h1><span class="spacer"></span><button class="btn sm" onclick="print()">🖨️ Imprimer</button></div>
  <p class="muted">${D.rappel}. Pistes indicatives : vérifiez les règles administratives sur service-public.fr avant la séance.</p>
  ${D.themes.map((th,t)=>`<section class="tblock t${t%4}"><h2>Groupe ${t+1} : ${esc(th.name)}</h2>
    ${th.qs.map(([q,p],qi)=>`<div class="aq"><h3>${qi+1}. ${esc(q)}</h3><div class="piste" style="margin-top:0">${p}</div></div>`).join("")}</section>`).join("")}`;
}

/* ===== Espace stagiaire ===== */
function renderChoose(){
  const salle = sess.get("afec:salle", null);
  const ok = !!salleName(salle);
  app.innerHTML = `
  <div class="toolbar"><a href="#/" class="btn ghost">← Accueil</a><h1>Espace stagiaire</h1></div>
  <section class="panel">
    <h2 style="margin-top:0"><span class="step">1</span> Votre salle</h2>
    <div class="spick">${SALLES.map(([id,nm])=>`<button class="btn ${salle===id?"primary":""}" data-salle="${id}">${esc(nm)}</button>`).join("")}</div>
  </section>
  <section class="panel ${ok?"":"dim"}">
    <h2 style="margin-top:0"><span class="step">2</span> Votre groupe</h2>
    ${ok?"":`<p class="muted">Choisissez d'abord votre salle.</p>`}
    <div class="gpick">${[1,2,3,4].map(g=>ok?`<a class="gbtn t${(g-1)%4}" href="#/groupe/${g}">Groupe ${g}</a>`:`<span class="gbtn off">Groupe ${g}</span>`).join("")}</div>
  </section>`;
  $$("[data-salle]").forEach(b=>b.onclick=()=>{ sess.set("afec:salle", b.dataset.salle); renderChoose(); });
}

function renderGroup(g){
  if(!(g>=1 && g<=4)){ location.hash="#/stagiaire"; return; }
  const salle = sess.get("afec:salle", null);
  if(!salleName(salle)){ location.hash="#/stagiaire"; return; }
  let day = sess.get("afec:day", null);
  let lastSent=0, statusTxt="", statusCls="", tmo, retryT, live=false, failed=false;
  app.innerHTML = `
  <div class="toolbar no-print"><a href="#/stagiaire" class="btn ghost">← Changer de groupe</a><span class="spacer"></span><span class="muted">${esc(salleName(salle))}</span></div>
  <div id="gbody"></div>`;
  const status = (txt,cls="") => { statusTxt=txt; statusCls=cls; const el=$("#sync"); if(el){ el.textContent=txt; el.className="sync "+cls; } };
  const key = () => `afec:ans:${day}:${g}`;
  const state = () => sess.get(key(), {answers:{}, timer:{dur:1500,left:1500,endAt:null}});

  async function sendNow(manual){
    clearTimeout(retryT);
    if(!day) return;
    if(!API_URL){ status("⚠️ Envoi non configuré : prévenez le formateur","err"); return; }
    const v = lastSent = Date.now();
    status("Envoi…");
    try{
      await apiPost({action:"save", room:salle, day, g, v, answers:state().answers});
      if(v!==lastSent || window._link!==link) return;
      failed=false;
      if(live){ status("✓ Reçu par le formateur","ok"); if(manual) toast("Réponses envoyées au formateur"); }
      else { status("✓ Enregistré : le formateur le verra dès sa connexion","ok"); if(manual) toast("Réponses enregistrées pour le formateur"); }
    }catch(e){
      if(window._link!==link) return;
      failed=true; status("⚠️ Pas de connexion, nouvel essai dans quelques secondes…","err");
      if(manual) toast("Pas de connexion : nouvel essai automatique");
      retryT=setTimeout(()=>sendNow(false),6000);
    }
  }
  const setDay = d => { if(!DATA[d] || d===day) return; day=d; sess.set("afec:day", d); drawBody(); if(Object.keys(state().answers).length) sendNow(false); };

  const link = window._link = watchRoom(salle, {
    onDay: d => setDay(d),
    onStatus: s => {
      const was=live; live = s==="live";
      if(s==="live"){
        if(!was && !failed && !statusTxt.startsWith("Envoi") && !statusTxt.startsWith("Modif"))
          status(day && Object.keys(state().answers).length ? "✓ Reçu par le formateur" : "✓ Connecté au formateur", "ok");
        return;
      }
      if(s==="absent" && statusTxt.startsWith("✓ Enregistré")) return;
      status({ absent:"⏳ Formateur pas encore connecté : vous pouvez commencer, vos réponses lui parviendront", neterr:"⚠️ Pas de connexion Internet, nouvel essai…", noapi:"⚠️ Envoi non configuré : prévenez le formateur" }[s]||"", s==="absent"?"":"err");
      if(!day) showDayPick();
    }
  });
  const baseClose = link.close; link.close = () => { clearTimeout(retryT); baseClose(); };
  if(!statusTxt) status("⏳ Connexion au formateur…");

  function showDayPick(){
    const p=$("#daypick"); if(!p || p.dataset.on) return; p.dataset.on="1";
    p.innerHTML = `<p class="muted">Pas encore de connexion ? Vous pouvez commencer : choisissez la journée indiquée par le formateur. Vos réponses partiront dès que la connexion sera établie.</p>
      <div class="row">${Object.keys(DATA).map(k=>`<button class="btn" data-d="${k}">${k} · ${DATA[k].rappel}</button>`).join("")}</div>`;
    $$("[data-d]",p).forEach(b=>b.onclick=()=>setDay(b.dataset.d));
  }

  function drawBody(){
    clearTimeout(tmo);
    const body=$("#gbody");
    if(!day){
      body.innerHTML = `<section class="panel"><h1 style="margin-top:0">Groupe ${g}</h1><p><span class="sync" id="sync"></span></p><div id="daypick"></div></section>`;
      status(statusTxt,statusCls); setTimeout(()=>{ if(!day) showDayPick(); },12000);
      return;
    }
    const D=DATA[day], t=g-1, th=D.themes[t];
    if(!th){ body.innerHTML=`<div class="panel"><p>Il n'y a pas de groupe ${g} pour cette journée.</p><a class="btn" href="#/stagiaire">Changer de groupe</a></div>`; return; }
    const st=state(); const save=()=>sess.set(key(),st);
    const total=th.qs.length;
    body.innerHTML = `<div class="gpage t${t%4}">
    <div class="ghead">
      <div>
        <p class="kicker">${D.label} : ${D.rappel}</p>
        <h1>Groupe ${g}</h1>
        <div class="themes"><span class="theme t${t%4}">${esc(th.name)}</span></div>
      </div>
      <div class="no-print" id="gt">${timerHTML(false)}</div>
    </div>
    <div class="cmini"><span><b>Rôles :</b> 📖 Lecteur · ✍️ Secrétaire · 🗣️ Rapporteur · 👥 Tous participent</span><span><b>⏱️</b> 20 à 30 min</span><span><b>✅</b> Pour chaque question : une réponse (exemple facultatif)</span></div>
    <div class="progress"><div class="pbar"><div id="pfill"></div></div><span id="ptext" class="muted"></span><span id="sync" class="sync"></span></div>
    <section class="tblock t${t%4}"><h2>${esc(th.name)}</h2>
      ${th.qs.map(([q],qi)=>{ const k=`${t}-${qi}`, a=st.answers[k]||{}; return `
        <article class="qcard" data-k="${k}">
          <div class="qhead"><span class="qn">${qi+1}</span><h3>${esc(q)}</h3></div>
          <div class="fields">${FIELDS.map(f=>`
            <label><span class="flabel"><i class="dot ${a[f.k]?.trim()?"on":""}" data-dot="${f.k}"></i>${f.icon} ${f.label}</span>
            <textarea data-f="${f.k}" rows="2" placeholder="${f.ph}">${esc(a[f.k]||"")}</textarea></label>`).join("")}
          </div>
        </article>`; }).join("")}
    </section>
    <div class="actions">
      <button class="btn primary" id="send">📤 Envoyer au formateur</button>
      <button class="btn" id="present">🗣️ Présenter nos réponses</button>
      <button class="btn" onclick="print()">🖨️ Imprimer</button>
    </div></div>`;
    status(statusTxt,statusCls);
    const progress = () => {
      let done=0;
      $$(".qcard").forEach(card=>{ const a=st.answers[card.dataset.k]||{}; const ok=!!a.r?.trim(); if(ok) done++; card.classList.toggle("complete", ok); });
      $("#pfill").style.width=(100*done/total)+"%"; $("#ptext").textContent=`${done} / ${total} questions répondues`;
    };
    progress();
    $$("textarea[data-f]").forEach(ta=>{
      const fit=()=>{ ta.style.height="auto"; ta.style.height=ta.scrollHeight+4+"px"; }; fit();
      ta.addEventListener("input",()=>{
        fit();
        const card=ta.closest(".qcard"), k=card.dataset.k, f=ta.dataset.f;
        (st.answers[k] ||= {})[f]=ta.value; save();
        $(`[data-dot="${f}"]`,card).classList.toggle("on", !!ta.value.trim());
        progress(); status("Modifications en cours…");
        clearTimeout(tmo); tmo=setTimeout(()=>sendNow(false),1200);
      });
    });
    $("#send").onclick=()=>{ clearTimeout(tmo); sendNow(true); };
    $("#present").onclick=()=>{
      const m=document.createElement("div"); m.className="modal"; m.style.placeItems="start center"; m.style.overflow="auto";
      m.innerHTML=`<div class="box" style="max-width:900px;text-align:left">
        <div class="row"><h2>Groupe ${g} présente</h2><span class="spacer"></span><button class="btn sm primary" id="cl">Fermer</button></div>
        <div class="av big">${answersView(D,t,st.answers,false)}</div></div>`;
      document.body.appendChild(m); $("#cl",m).onclick=()=>m.remove();
    };
    bindTimer($("#gt"), st.timer, save);
  }
  drawBody();
}

route();
</script>
</body>
</html>
